<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Grace College Examination Seating ERP</title>
    <link rel="icon" href="https://res.cloudinary.com/de1tywvqm/image/upload/v1758813951/logo_eq52wb.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root {
    --dash-bg: #f4f2f7; --card-bg: #ffffff;
    --glass-bg: rgba(255,255,255,0.72); --glass-border: rgba(139,92,246,0.12);
    --purple-900: #1e0a5e; --purple-800: #2e1065; --purple-700: #4c1d95;
    --purple-600: #6d28d9; --purple-500: #7c3aed; --purple-400: #8b5cf6;
    --purple-300: #a78bfa; --purple-200: #c4b5fd; --purple-100: #ede9fe; --purple-50: #f5f3ff;
    --blue-500: #3b82f6; --blue-100: #dbeafe;
    --green-500: #10b981; --green-100: #d1fae5;
    --orange-500: #f59e0b; --orange-100: #fef3c7;
    --indigo-500: #6366f1; --indigo-100: #e0e7ff;
    --gray-50: #f8fafc; --gray-100: #f1f5f9; --gray-200: #e2e8f0;
    --gray-500: #64748b; --gray-600: #475569; --gray-700: #334155; --gray-900: #0f172a;
    --radius-md: 12px; --radius-lg: 16px; --radius-xl: 20px;
    --transition: 0.3s cubic-bezier(.4,0,.2,1);
}
body { background: var(--dash-bg) !important; }
.dash-main { padding: 0 0 100px 0; min-height: 100vh; }
.dash-topbar {
    background: var(--glass-bg); backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--glass-border);
    padding: 12px 28px; display: flex; align-items: center; justify-content: space-between;
    gap: 16px; position: sticky; top: 0; z-index: 100; flex-wrap: wrap;
}
.topbar-left { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.topbar-date-time { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--gray-600); font-weight: 500; }
.topbar-date-time i { color: var(--purple-500); font-size: 0.85rem; }
.topbar-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; background: var(--purple-50); border: 1px solid var(--purple-100); border-radius: 20px; font-size: 0.72rem; font-weight: 600; color: var(--purple-700); white-space: nowrap; }
.dash-content { padding: 24px 28px; max-width: 1600px; margin: 0 auto; }
.dash-hero {
    background: linear-gradient(135deg, var(--purple-700) 0%, var(--purple-500) 50%, var(--purple-400) 100%);
    border-radius: var(--radius-xl); padding: 36px 40px; display: flex; align-items: center; justify-content: space-between;
    gap: 32px; margin-bottom: 28px; position: relative; overflow: hidden; box-shadow: 0 12px 40px rgba(109,40,217,0.25);
}
.hero-text { flex: 1; min-width: 0; z-index: 1; }
.hero-text h1 { font-size: 1.8rem; font-weight: 800; color: #fff; margin-bottom: 10px; letter-spacing: -0.5px; line-height: 1.2; }
.hero-text p { font-size: 0.88rem; color: rgba(255,255,255,0.78); margin-bottom: 22px; max-width: 560px; line-height: 1.6; }
.hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.hero-btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 18px; border-radius: var(--radius-md); font-size: 0.8rem; font-weight: 600; text-decoration: none; transition: all var(--transition); border: none; cursor: pointer; }
.hero-btn-primary { background: #fff; color: var(--purple-700); }
.hero-btn-primary:hover { background: var(--purple-100); color: var(--purple-800); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
.hero-btn-outline { background: rgba(255,255,255,0.12); color: #fff; border: 1.5px solid rgba(255,255,255,0.3); }
.hero-btn-outline:hover { background: rgba(255,255,255,0.22); color: #fff; transform: translateY(-2px); }
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; margin-bottom: 28px; }
.kpi-card { background: var(--card-bg); border: 1px solid var(--glass-border); border-radius: var(--radius-lg); padding: 20px; position: relative; overflow: hidden; transition: all var(--transition); }
.kpi-card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(109,40,217,0.12); }
.kpi-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
.kpi-icon { width: 42px; height: 42px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; }
.kpi-value { font-size: 1.7rem; font-weight: 800; color: var(--gray-900); line-height: 1.1; margin-bottom: 4px; }
.kpi-label { font-size: 0.75rem; font-weight: 500; color: var(--gray-500); margin-bottom: 10px; }
.kpi-progress { height: 4px; background: var(--gray-100); border-radius: 4px; overflow: hidden; }
.kpi-progress-bar { height: 100%; border-radius: 4px; transition: width 1.2s ease-out; }
.quick-actions-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 28px; }
.quick-action { background: var(--card-bg); border: 1px solid var(--glass-border); border-radius: var(--radius-lg); padding: 20px 16px; text-align: center; text-decoration: none; transition: all var(--transition); display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer; }
.quick-action:hover { transform: translateY(-4px); box-shadow: 0 10px 24px rgba(109,40,217,0.12); border-color: var(--purple-300); text-decoration: none; }
.quick-action-icon { width: 46px; height: 46px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
.quick-action-label { font-size: 0.78rem; font-weight: 600; color: var(--gray-700); }
@media (max-width: 1024px) {
    .dash-content { padding: 16px; }
    .dash-hero { padding: 24px 20px; flex-direction: column; text-align: center; }
    .hero-text h1 { font-size: 1.4rem; }
    .hero-actions { justify-content: center; }
}
</style>
</head>
<body>

<script src="app.js"></script>
<script src="nav.js"></script>
<script>renderMenu('index.html');</script>

<div class="dash-main">
<div class="dash-topbar">
    <div class="topbar-left">
        <div class="topbar-date-time">
            <i class="fa-regular fa-calendar"></i>
            <span id="topbarDate"></span>
        </div>
        <div class="topbar-date-time">
            <i class="fa-regular fa-clock"></i>
            <span id="topbarTime"></span>
        </div>
        <div class="topbar-badge">
            <i class="fa-solid fa-graduation-cap"></i>
            <span id="academicYear"></span>
        </div>
    </div>
</div>

<div class="dash-content">

<!-- HERO -->
<div class="dash-hero">
    <div class="hero-text">
        <h1>Grace College Examination Seating ERP</h1>
        <p>Centralized examination seating, hall allocation, question paper planning, department-wise analytics and real-time monitoring.</p>
        <div class="hero-actions">
            <a href="allocation.html" class="hero-btn hero-btn-primary"><i class="fa-solid fa-chair"></i> Begin Seating</a>
            <a href="management.html" class="hero-btn hero-btn-outline"><i class="fa-solid fa-building-columns"></i> Hall Management</a>
            <a href="students.html" class="hero-btn hero-btn-outline"><i class="fa-solid fa-users"></i> Manage Students</a>
            <a href="reports.html" class="hero-btn hero-btn-outline"><i class="fa-solid fa-file-lines"></i> Reports</a>
        </div>
    </div>
</div>

<!-- KPI CARDS -->
<div class="kpi-grid" id="kpiGrid"></div>

<!-- QUICK ACTIONS -->
<h5 class="fw-bold mb-3" style="color:var(--gray-900);"><i class="fa-solid fa-bolt me-2" style="color:var(--purple-500);"></i>Quick Actions</h5>
<div class="quick-actions-grid">
    <a href="allocation.html" class="quick-action">
        <div class="quick-action-icon" style="background:var(--purple-100);color:var(--purple-600);"><i class="fa-solid fa-chair"></i></div>
        <div class="quick-action-label">Seat Allocation</div>
    </a>
    <a href="management.html" class="quick-action">
        <div class="quick-action-icon" style="background:var(--blue-100);color:var(--blue-500);"><i class="fa-solid fa-list-check"></i></div>
        <div class="quick-action-label">View/Edit Plans</div>
    </a>
    <a href="reports.html" class="quick-action">
        <div class="quick-action-icon" style="background:#ccfbf1;color:#14b8a6;"><i class="fa-solid fa-file-lines"></i></div>
        <div class="quick-action-label">Question Papers</div>
    </a>
    <a href="students.html" class="quick-action">
        <div class="quick-action-icon" style="background:var(--indigo-100);color:var(--indigo-500);"><i class="fa-solid fa-user-plus"></i></div>
        <div class="quick-action-label">Manage Students</div>
    </a>
</div>

</div>
</div>

<script>
(function() {
    // Date/time
    const now = new Date();
    const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    document.getElementById('topbarDate').textContent = `${days[now.getDay()]}, ${String(now.getDate()).padStart(2,'0')} ${months[now.getMonth()]} ${now.getFullYear()}`;
    document.getElementById('topbarTime').textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    document.getElementById('academicYear').textContent = `Academic Year ${now.getFullYear()}-${now.getFullYear()+1}`;

    // KPI data
    const totalStudents = Students.count();
    const allDepts = {};
    Students.getAll().filter(s => !s.stu_status?.startsWith('Discontinu')).forEach(s => {
        const d = s.stu_dept || getStudentDept(s.stu_regno);
        if (d) allDepts[d] = true;
    });
    const totalDepartments = Object.keys(allDepts).length;
    const totalHalls = Halls.getNames().length;

    const allocs = SeatAllocations.getAll();
    const allocatedStudents = allocs.filter(a => a.reg_no).length;
    const totalSeats = allocs.length;
    const remainingSeats = totalSeats - allocatedStudents;
    const huPct = totalSeats > 0 ? Math.round((allocatedStudents / totalSeats) * 1000) / 10 : 0;

    const kpis = [
        { icon: 'fa-graduation-cap', color: 'var(--blue-500)', bg: 'var(--blue-100)', value: totalStudents.toLocaleString(), label: 'Registered Students', pct: 100 },
        { icon: 'fa-building-columns', color: 'var(--purple-500)', bg: 'var(--purple-100)', value: totalDepartments, label: 'Total Departments', pct: 100 },
        { icon: 'fa-door-open', color: 'var(--indigo-500)', bg: 'var(--indigo-100)', value: totalHalls, label: 'Exam Halls', pct: 100 },
        { icon: 'fa-circle-check', color: 'var(--green-500)', bg: 'var(--green-100)', value: allocatedStudents.toLocaleString(), label: 'Allocated Seats', pct: huPct },
        { icon: 'fa-couch', color: 'var(--orange-500)', bg: 'var(--orange-100)', value: remainingSeats.toLocaleString(), label: 'Remaining Capacity', pct: 100 },
    ];

    document.getElementById('kpiGrid').innerHTML = kpis.map(k => `
        <div class="kpi-card">
            <div class="kpi-header">
                <div class="kpi-icon" style="background:${k.bg};color:${k.color};"><i class="fa-solid ${k.icon}"></i></div>
            </div>
            <div class="kpi-value">${k.value}</div>
            <div class="kpi-label">${k.label}</div>
            <div class="kpi-progress"><div class="kpi-progress-bar" style="background:${k.color}; width:${k.pct}%;"></div></div>
        </div>
    `).join('');
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
