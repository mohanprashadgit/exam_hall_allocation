<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Question Paper Distribution - Grace Seating ERP</title>
    <link rel="icon" href="https://res.cloudinary.com/de1tywvqm/image/upload/v1758813951/logo_eq52wb.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
:root {
    --navy: #4c1d95; --navy-mid: #6d28d9; --gold: #8b5cf6;
    --cream: #faf7f2; --border: #e5e1d8; --muted: #6b7280; --radius: 10px;
}
*, *::before, *::after { box-sizing: border-box; }
body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: #1f2937; min-height: 100vh; }
.page-wrap { padding: 28px 32px 80px; max-width: 1400px; margin: 0 auto; }
.filter-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 22px; box-shadow: 0 2px 10px rgba(76,29,149,.06); }
.filter-label { font-size: .68rem; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; display: block; }
.filter-select { height: 42px; border-radius: 8px; font-family: inherit; font-size: .88rem; border: 1.5px solid var(--border); padding: 0 12px; background: var(--cream); color: #1f2937; outline: none; }
.btn-print { background: var(--gold); color: #fff; border: none; height: 42px; padding: 0 20px; border-radius: 8px; font-weight: 600; font-size: .88rem; cursor: pointer; }
.report-container { background: #fff; color: #111827; padding: 30px 40px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: 0 4px 15px rgba(0,0,0,0.03); overflow-x: auto; }
.report-header { text-align: center; margin-bottom: 30px; }
.report-header h2 { font-weight: bold; font-size: 1.4rem; margin: 0 0 5px 0; text-transform: uppercase; }
.report-header h3 { font-weight: bold; font-size: 1.1rem; margin: 0 0 5px 0; text-transform: uppercase; }
.report-header h4 { font-weight: bold; font-size: 1.1rem; margin: 0; text-transform: uppercase; }
.report-meta { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; font-size: 1.1rem; padding: 0 10px; }
.matrix-table { width: 100%; border-collapse: collapse; margin-bottom: 40px; color: #111827; }
.matrix-table th, .matrix-table td { border: 1px solid #d1d5db; padding: 12px; text-align: center; vertical-align: middle; font-size: 0.95rem; }
.matrix-table th { font-weight: bold; font-size: 1.05rem; }
.matrix-table td { font-weight: bold; font-size: 1.05rem; }
.hall-col { text-align: center; font-weight: bold; width: 15%; }
.signature-line { text-align: center; font-weight: bold; font-size: 1.1rem; margin-top: 40px; }
@media print {
    @page { size: A4 landscape; margin: 15mm; }
    body { background: #fff !important; padding-left: 0 !important; color: #000 !important; }
    .no-print { display: none !important; }
    .page-wrap { padding: 0 !important; max-width: 100%; margin: 0 !important; }
    .report-container { background: #fff !important; color: #000 !important; padding: 0 !important; box-shadow: none !important; border: none !important; }
    .matrix-table th, .matrix-table td { border: 1px solid #000 !important; color: #000 !important; }
}
</style>
</head>
<body>

<script src="app.js"></script>
<script src="nav.js"></script>
<script>renderMenu('reports.html');</script>

<div class="page-wrap">

    <!-- Filters — auto-apply on change -->
    <div class="no-print" style="margin-bottom:30px;">
        <div class="filter-card">
            <div class="row g-3 align-items-end">
                <div class="col-md-2">
                    <label class="filter-label">Exam Date</label>
                    <select id="filterDate" class="filter-select w-100" onchange="renderReport()"></select>
                </div>
                <div class="col-md-2">
                    <label class="filter-label">Exam Type</label>
                    <select id="filterType" class="filter-select w-100" onchange="renderReport()">
                        <option value="">All Types</option>
                        <option value="University">University</option>
                        <option value="Internal">Internal</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="filter-label">Session</label>
                    <select id="filterSession" class="filter-select w-100" onchange="renderReport()">
                        <option value="">All Sessions</option>
                        <option value="FN">FN (Forenoon)</option>
                        <option value="AN">AN (Afternoon)</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="filter-label">Hall Name</label>
                    <select id="filterHall" class="filter-select w-100" onchange="renderReport()">
                        <option value="">All Halls</option>
                    </select>
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button type="button" class="btn-print" onclick="window.print()"><i class="bi bi-printer me-1"></i>Print</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Report Area -->
    <div id="reportArea"></div>

</div>

<script>
function populateFilters() {
    const dates = SeatAllocations.getDistinctDates();
    const dateSelect = document.getElementById('filterDate');
    dateSelect.innerHTML = '<option value="">All Dates</option>';
    dates.forEach(d => {
        dateSelect.innerHTML += `<option value="${d}">${formatDateDMY(d)}</option>`;
    });
    if (dates.length > 0) dateSelect.value = dates[0];

    const halls = Halls.getNames();
    const hallSelect = document.getElementById('filterHall');
    hallSelect.innerHTML = '<option value="">All Halls</option>';
    halls.forEach(h => {
        hallSelect.innerHTML += `<option value="${escapeHtml(h)}">${escapeHtml(h)}</option>`;
    });
}

function renderReport() {
    const filterDate = document.getElementById('filterDate').value;
    const filterType = document.getElementById('filterType').value;
    const filterSession = document.getElementById('filterSession').value;
    const filterHall = document.getElementById('filterHall').value;

    let allocs = SeatAllocations.getAll().filter(a => a.reg_no);

    if (filterDate) allocs = allocs.filter(a => a.exam_date === filterDate);
    if (filterType) allocs = allocs.filter(a => a.exam_type === filterType);
    if (filterSession) allocs = allocs.filter(a => a.session === filterSession);
    if (filterHall) allocs = allocs.filter(a => a.hall_no === filterHall);

    // Build pivot
    const pivot = {};
    const subjects = {};
    let grandTotal = 0;

    allocs.forEach(a => {
        const h = a.hall_no;
        const s = a.subject_name || 'Unknown';
        if (!pivot[h]) pivot[h] = {};
        if (!pivot[h][s]) pivot[h][s] = 0;
        pivot[h][s]++;
        subjects[s] = true;
        grandTotal++;
    });

    const subjectList = Object.keys(subjects).sort();
    const hallList = Object.keys(pivot).sort();

    if (hallList.length === 0) {
        document.getElementById('reportArea').innerHTML = `
            <div class="bg-white p-5 text-center border rounded">
                <div class="fs-1 mb-2">📄</div>
                <h3>No Data Available</h3>
                <p>No seat allocations found for the selected filters. Please try another Date/Session/Exam Type.</p>
            </div>`;
        return;
    }

    const now = new Date();
    const months = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
    let monthYear = filterDate ? (() => { const d = new Date(filterDate + 'T00:00:00'); return months[d.getMonth()] + '/' + d.getFullYear(); })() : months[now.getMonth()] + '/' + now.getFullYear();
    const displayDate = filterDate ? (() => { const d = new Date(filterDate + 'T00:00:00'); return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear(); })() : 'ALL';

    let html = `
    <div class="report-container">
        <div class="report-header">
            <h2>GRACE COLLEGE OF ENGINEERING</h2>
            <h3>EXAMINATIONS ${monthYear}</h3>
            <h4>QUESTION PAPER DISTRIBUTION MATRIX</h4>
        </div>
        <div class="report-meta">
            <div>DATE: ${displayDate}</div>
            <div>TYPE: ${escapeHtml(filterType || 'ALL')} | SESSION: ${escapeHtml(filterSession || 'ALL')}</div>
        </div>
        <table class="matrix-table">
            <thead><tr>
                <th class="hall-col">Name of<br>the Hall/<br>Subject<br>Code</th>
                ${subjectList.map(s => `<th>${escapeHtml(s)}</th>`).join('')}
            </tr></thead>
            <tbody>
                ${hallList.map(hall => `<tr>
                    <td class="hall-col">${escapeHtml(hall)}</td>
                    ${subjectList.map(s => `<td>${(pivot[hall]?.[s] || 0) > 0 ? pivot[hall][s] : '-'}</td>`).join('')}
                </tr>`).join('')}
            </tbody>
            <tfoot>
                <tr>
                    <td class="hall-col">Sub Total</td>
                    ${subjectList.map(s => {
                        let colTotal = 0;
                        hallList.forEach(h => colTotal += (pivot[h]?.[s] || 0));
                        return `<td>${colTotal > 0 ? colTotal : '-'}</td>`;
                    }).join('')}
                </tr>
                <tr>
                    <td class="hall-col">GRAND TOTAL</td>
                    <td colspan="${subjectList.length}">${grandTotal}</td>
                </tr>
            </tfoot>
        </table>
        <div class="signature-line">Signature of the Chief Superintendent</div>
    </div>`;

    document.getElementById('reportArea').innerHTML = html;
}

populateFilters();
renderReport();
</script>
</body>
</html>
